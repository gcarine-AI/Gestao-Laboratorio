name: CI


on:
  pull_request:
    branches:
      - develop-idp
  workflow_dispatch:

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Instalar dependências
        run: npm ci

      - name: Generate environment.ts
        run: |
          mkdir -p src/environments
          echo "export const environment = { production: false, supabaseURL: '${{ env.SUPABASE_URL }}', supabaseKey: '${{ env.SUPABASE_KEY }}' };" > src/environments/environment.development.ts

      - name: Executar lint
        run: npm run lint

      - name: Executar build
        run: npm run build
